name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      - name: Build plugin and plugin list
        run: |
          cd "$GITHUB_WORKSPACE/src"
          gradle AsyaAnimeleri:make makePluginsJson

      - name: Prepare builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp "$GITHUB_WORKSPACE/src/AsyaAnimeleri/build/AsyaAnimeleri.cs3" .
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" .

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push
